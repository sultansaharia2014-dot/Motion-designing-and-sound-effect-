<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1991 SOSUS Great Acoustic Void — Animated Short</title>
  <style>
    :root {
      --bg: #0c1118;
      --panel: rgba(20, 27, 38, 0.9);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --danger: #ff4757;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #162235 0%, var(--bg) 75%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }

    .stage-wrap {
      position: relative;
      height: calc(100vh - 118px);
      max-height: 920px;
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(255, 255, 255, 0.1);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .rec-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 6px 11px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.5);
      pointer-events: none;
    }

    .rec-badge.active {
      display: flex;
    }

    .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 0.9s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    .controls {
      width: min(760px, 96vw);
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      min-width: 84px;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) var(--prog, 0%), rgba(255,255,255,0.14) var(--prog, 0%));
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: var(--accent);
      color: #08121e;
      border-color: transparent;
    }

    button.primary:hover {
      background: #67d0fc;
    }

    button.record {
      background: rgba(255, 71, 87, 0.16);
      border-color: rgba(255, 71, 87, 0.45);
      color: #ff8a95;
    }

    button.record:hover {
      background: rgba(255, 71, 87, 0.28);
    }

    button.record.recording {
      background: var(--danger);
      color: #fff;
      border-color: transparent;
    }

    .scene-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .scene-pill {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
    }

    .scene-pill.active {
      color: #08121e;
      background: #ffd43b;
      border-color: transparent;
    }
  </style>
</head>
<body>

  <div class="stage-wrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div id="recBadge" class="rec-badge">
      <span class="rec-dot"></span>
      <span id="recText">REC 00:00</span>
    </div>
  </div>

  <div class="controls">
    <div class="scrubber-row">
      <span id="timeLabel" class="time-label">00:00 / 01:12</span>
      <input id="scrubber" type="range" min="0" max="72" step="0.02" value="0" />
    </div>
    <div class="btn-row">
      <div class="btn-group">
        <button id="playBtn" class="primary">▶ Play</button>
        <button id="restartBtn">↺ Restart</button>
        <button id="muteBtn">🔊 SFX On</button>
      </div>
      <div class="scene-pills" id="scenePills">
        <button class="scene-pill" data-t="0">Hook</button>
        <button class="scene-pill" data-t="5">SOSUS</button>
        <button class="scene-pill" data-t="20">Silence</button>
        <button class="scene-pill" data-t="40">Theories</button>
        <button class="scene-pill" data-t="60">Ending</button>
      </div>
      <button id="recordBtn" class="record">● Record Video</button>
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;
    const DURATION = 72.0;

    // UI Elements
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const recordBtn = document.getElementById('recordBtn');
    const scrubber = document.getElementById('scrubber');
    const timeLabel = document.getElementById('timeLabel');
    const recBadge = document.getElementById('recBadge');
    const recText = document.getElementById('recText');
    const scenePills = Array.from(document.querySelectorAll('.scene-pill'));

    // Playback State
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = null;
    let isMuted = false;

    // Recording State
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // =========================================================================
    // WEB AUDIO API SYNTHESIZED SFX ENGINE
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.mediaDest = null;
        this.ambientGain = null;
        this.ambientOsc1 = null;
        this.ambientOsc2 = null;
        this.firedCues = new Set();
        this.cues = this.buildCues();
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = isMuted ? 0 : 0.85;

        this.mediaDest = this.ctx.createMediaStreamDestination();
        this.master.connect(this.ctx.destination);
        this.master.connect(this.mediaDest);

        // Ambient deep underwater / bunker hum
        this.ambientGain = this.ctx.createGain();
        this.ambientGain.gain.value = 0;
        this.ambientGain.connect(this.master);

        this.ambientOsc1 = this.ctx.createOscillator();
        this.ambientOsc1.type = 'sine';
        this.ambientOsc1.frequency.value = 58;

        this.ambientOsc2 = this.ctx.createOscillator();
        this.ambientOsc2.type = 'triangle';
        this.ambientOsc2.frequency.value = 116.5;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 190;

        this.ambientOsc1.connect(filter);
        this.ambientOsc2.connect(filter);
        filter.connect(this.ambientGain);
        this.ambientOsc1.start();
        this.ambientOsc2.start();
      }

      setMuted(m) {
        if (this.master) {
          this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ctx.currentTime, 0.02);
        }
      }

      updateAmbient(t, playing) {
        if (!this.ctx || !this.ambientGain) return;
        const inSilence = (t >= 20.0 && t < 40.0) || (t >= 60.0 && t < 61.2);
        let target = 0;
        if (playing && !inSilence) {
          target = t >= 61.2 ? 0.14 : 0.09;
        }
        // Hard cut at the moment of silence for visceral shock
        if (inSilence || !playing) {
          this.ambientGain.gain.setValueAtTime(0, this.ctx.currentTime);
        } else {
          this.ambientGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.06);
        }
      }

      resetCues(time = 0) {
        this.firedCues.clear();
        for (const c of this.cues) {
          if (c.t < time) this.firedCues.add(c.id);
        }
      }

      checkCues(prevT, currT) {
        if (!this.ctx) return;
        for (const c of this.cues) {
          if (!this.firedCues.has(c.id) && currT >= c.t && prevT <= c.t + 0.25) {
            this.firedCues.add(c.id);
            c.fn();
          }
        }
      }

      ping(freq = 1280, dur = 0.75, vol = 0.24) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.96, now + dur);

        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(vol, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      }

      pop(pitch = 520, up = true) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(up ? pitch * 0.65 : pitch * 1.35, now);
        osc.frequency.exponentialRampToValueAtTime(up ? pitch * 1.45 : pitch * 0.55, now + 0.085);

        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      bassDrop(startFreq = 120, endFreq = 32, dur = 0.9, vol = 0.55) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur);

        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      }

      shockCut() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Sharp high click + low thump + eerie descending whine
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.24);
        g.gain.setValueAtTime(0.28, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + 0.26);
        this.bassDrop(95, 28, 0.35, 0.45);
      }

      whaleSong() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(430, now + 0.35);
        osc.frequency.linearRampToValueAtTime(220, now + 0.95);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.14, now + 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        osc.connect(g);
        g.connect(this.master);
        osc.start(now);
        osc.stop(now + 1.05);
      }

      slap(vol = 0.28) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.025));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 950;
        const g = this.ctx.createGain();
        g.gain.value = vol;
        noise.connect(filter);
        filter.connect(g);
        g.connect(this.master);
        noise.start(now);
      }

      stampSlam() {
        this.slap(0.5);
        this.bassDrop(140, 34, 0.55, 0.65);
      }

      buildCues() {
        return [
          { id: 'c0',  t: 0.15, fn: () => this.whaleSong() },
          { id: 'c1',  t: 1.4,  fn: () => this.pop(540, true) },
          { id: 'c2',  t: 2.6,  fn: () => this.shockCut() },
          { id: 'c3',  t: 3.5,  fn: () => this.pop(420, true) },
          { id: 'c4',  t: 5.1,  fn: () => this.pop(600, true) },
          { id: 'c5',  t: 6.8,  fn: () => this.ping(1320, 0.85, 0.22) },
          { id: 'c6',  t: 9.6,  fn: () => this.ping(1180, 0.8, 0.20) },
          { id: 'c7',  t: 11.4, fn: () => this.pop(700, true) },
          { id: 'c8',  t: 14.6, fn: () => this.whaleSong() },
          { id: 'c9',  t: 16.5, fn: () => this.ping(1400, 0.6, 0.16) },
          { id: 'c10', t: 20.0, fn: () => this.shockCut() }, // Sudden silence slam
          { id: 'c11', t: 23.8, fn: () => this.slap(0.28) },
          { id: 'c12', t: 25.0, fn: () => this.slap(0.32) },
          { id: 'c13', t: 26.8, fn: () => this.pop(360, false) },
          { id: 'c14', t: 30.0, fn: () => this.pop(460, false) },
          { id: 'c15', t: 35.2, fn: () => this.pop(510, true) },
          { id: 'c16', t: 40.0, fn: () => this.bassDrop(110, 38, 0.7, 0.45) },
          { id: 'c17', t: 44.6, fn: () => this.pop(580, true) },
          { id: 'c18', t: 47.0, fn: () => this.bassDrop(90, 30, 0.8, 0.4) },
          { id: 'c19', t: 51.6, fn: () => this.pop(660, true) },
          { id: 'c20', t: 54.0, fn: () => this.ping(1550, 0.4, 0.18) },
          { id: 'c21', t: 57.5, fn: () => this.pop(390, false) },
          { id: 'c22', t: 60.0, fn: () => this.slap(0.22) },
          { id: 'c23', t: 61.3, fn: () => this.bassDrop(85, 24, 1.3, 0.7) },
          { id: 'c24', t: 63.4, fn: () => this.bassDrop(78, 22, 1.3, 0.72) },
          { id: 'c25', t: 66.2, fn: () => this.ping(980, 1.2, 0.25) },
          { id: 'c26', t: 69.3, fn: () => this.stampSlam() }
        ];
      }
    }

    const sfx = new SoundEngine();

    // =========================================================================
    // GRAPHIC HELPERS & PATTERNS (Reference Style: Thick Outlines + Cel Shade)
    // =========================================================================
    const INK = '#191615';
    const FONT_DISPLAY = `'Impact', 'Arial Black', 'Trebuchet MS', sans-serif`;
    const FONT_BOLD = `'Arial Black', 'Segoe UI', sans-serif`;

    // Create reusable halftone dot pattern
    const halftoneCanvas = document.createElement('canvas');
    halftoneCanvas.width = 24;
    halftoneCanvas.height = 24;
    const hctx = halftoneCanvas.getContext('2d');
    hctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    hctx.beginPath();
    hctx.arc(6, 6, 3.2, 0, Math.PI * 2);
    hctx.arc(18, 18, 3.2, 0, Math.PI * 2);
    hctx.fill();
    const halftonePattern = ctx.createPattern(halftoneCanvas, 'repeat');

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      const t = clamp(x, 0, 1);
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - clamp(x, 0, 1), 3);
    }

    function springPop(t, start, dur = 0.28) {
      if (t < start) return 0;
      const u = (t - start) / dur;
      return u >= 1 ? 1 : easeOutBack(u);
    }

    function roundRect(x, y, w, h, r, fill, stroke, lw = 8) {
      ctx.beginPath();
      const rad = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lw;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
    }

    function drawBadge(text, x, y, scale = 1, bg = '#ffd43b', fg = '#191615', rot = -0.05) {
      if (scale <= 0.01) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(scale, scale);
      ctx.font = `900 54px ${FONT_BOLD}`;
      const m = ctx.measureText(text);
      const pw = m.width + 58;
      const ph = 88;
      // Drop shadow
      roundRect(-pw / 2 + 8, -ph / 2 + 10, pw, ph, 18, 'rgba(0,0,0,0.45)', null);
      roundRect(-pw / 2, -ph / 2, pw, ph, 18, bg, INK, 8);
      ctx.fillStyle = fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 3);
      ctx.restore();
    }

    function drawComicHeader(text, x, y, color = '#ff9f1c', size = 86, scale = 1) {
      if (scale <= 0.01) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.font = `900 ${size}px ${FONT_DISPLAY}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      // Hard comic extrusion
      ctx.fillStyle = '#000';
      ctx.fillText(text, 8, 10);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 18;
      ctx.strokeText(text, 0, 0);
      ctx.fillStyle = color;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function drawSweatDrop(x, y, s = 1, t = 0) {
      ctx.save();
      ctx.translate(x, y + Math.sin(t * 9) * 5);
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.quadraticCurveTo(20, 4, 16, 18);
      ctx.arc(0, 16, 16, 0, Math.PI, false);
      ctx.quadraticCurveTo(-20, 4, 0, -24);
      ctx.closePath();
      ctx.fillStyle = '#5eead4';
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.restore();
    }

    // =========================================================================
    // CHIBI CHARACTERS & PROPS (Exact Reference Proportions)
    // =========================================================================
    function drawChibiOperator(x, y, scale = 1, opts = {}) {
      const {
        mood = 'chill',     // 'chill', 'happy', 'smug', 'shocked', 'panicked', 'skeptic', 'terrified'
        hat = 'navy',       // 'navy', 'headphones', 'none'
        suit = '#334155',   // uniform color
        accent = '#fbbf24', // trim
        time = 0,
        armLeft = 'down',   // 'down', 'mug', 'up', 'head', 'point'
        armRight = 'down',
        talking = false,
        redGlow = false
      } = opts;

      const bob = mood === 'panicked'
        ? Math.sin(time * 36) * 6
        : Math.sin(time * 3.5) * 6;
      const shakeX = mood === 'panicked' ? Math.sin(time * 48) * 5 : 0;

      ctx.save();
      ctx.translate(x + shakeX, y + bob);
      ctx.scale(scale, scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Body (cute bell/pill shape like reference soldiers/generals)
      ctx.beginPath();
      ctx.moveTo(-88, 230);
      ctx.quadraticCurveTo(-96, 95, -52, 65);
      ctx.lineTo(52, 65);
      ctx.quadraticCurveTo(96, 95, 88, 230);
      ctx.closePath();

    function drawCRTMonitor(x, y, w, h, mode = 'active', time = 0, label = 'CH-01') {
      ctx.save();
      ctx.translate(x, y);
      // Casing
      roundRect(-w / 2, -h / 2, w, h, 24, '#334155', INK, 9);
      // Screen
      const pad = 22;
      const sx = -w / 2 + pad;
      const sy = -h / 2 + pad;
      const sw = w - pad * 2;
      const sh = h - pad * 2 - 22;
      roundRect(sx, sy, sw, sh, 14, mode === 'spike' ? '#24090d' : '#051a14', INK, 7);

      // Grid lines
      ctx.save();
      ctx.beginPath();
      ctx.rect(sx, sy, sw, sh);
      ctx.clip();
      ctx.strokeStyle = mode === 'spike' ? 'rgba(255,70,70,0.22)' : 'rgba(52,211,153,0.18)';
      ctx.lineWidth = 2;
      for (let gx = sx; gx < sx + sw; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, sy); ctx.lineTo(gx, sy + sh); ctx.stroke();
      }
      for (let gy = sy; gy < sy + sh; gy += 40) {
        ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx + sw, gy); ctx.stroke();
      }

      // Waveform
      ctx.beginPath();
      const midY = sy + sh / 2;
      for (let i = 0; i <= sw; i += 6) {
        let amp = 0;
        if (mode === 'active') {
          amp = (Math.sin(i * 0.06 + time * 14) * 0.5 + Math.sin(i * 0.14 - time * 9) * 0.5) * (sh * 0.34);
        } else if (mode === 'spike') {
          const dist = Math.abs(i - ((time * 260) % sw));
          const thump = dist < 40 ? Math.cos((dist / 40) * Math.PI * 0.5) * (sh * 0.44) : 0;
          amp = thump * Math.sin(i * 0.4) + (Math.random() - 0.5) * 14;
        } else {
          amp = 0; // DEAD FLAT
        }
        const py = midY + amp;
        if (i === 0) ctx.moveTo(sx + i, py);
        else ctx.lineTo(sx + i, py);
      }
      ctx.strokeStyle = mode === 'spike' ? '#ff4757' : (mode === 'flat' ? '#ef4444' : '#34d399');
      ctx.lineWidth = 7;
      ctx.stroke();
      ctx.restore();

      // Label & status LED
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `800 22px ${FONT_BOLD}`;
      ctx.textAlign = 'left';
      ctx.fillText(label, sx + 8, sy + sh + 22);

      ctx.beginPath();
      ctx.arc(sx + sw - 16, sy + sh + 14, 9, 0, Math.PI * 2);
      ctx.fillStyle = mode === 'active' ? '#22c55e' : '#ef4444';
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function drawSubtitles(t) {
      const active = SUBTITLES.find(s => t >= s.start && t <= s.end);
      if (!active) return;

      const age = t - active.start;
      const exitT = active.end - t;
      const pop = age < 0.18 ? easeOutBack(age / 0.18) : (exitT < 0.1 ? exitT / 0.1 : 1);

      ctx.save();
      ctx.translate(W / 2, 1465);
      ctx.scale(pop, pop);

      const lineHeight = 76;
      const startY = -((active.lines.length - 1) * lineHeight) / 2;

      active.lines.forEach((line, li) => {
        ctx.font = `900 62px ${FONT_DISPLAY}`;
        const widths = line.map(w => ctx.measureText(w.t).width);
        const space = 20;
        const totalW = widths.reduce((a, b) => a + b, 0) + space * (line.length - 1);
        let cx = -totalW / 2;
        const cy = startY + li * lineHeight;

        line.forEach((word, wi) => {
          const wCenter = cx + widths[wi] / 2;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          // Hard shadow
          ctx.fillStyle = '#000';
          ctx.fillText(word.t, wCenter + 5, cy + 7);
          // Thick outline
          ctx.strokeStyle = '#121010';
          ctx.lineWidth = 17;
          ctx.strokeText(word.t, wCenter, cy);
          // Color fill
          ctx.fillStyle = word.c;
          ctx.fillText(word.t, wCenter, cy);

          cx += widths[wi] + space;
        });
      });

      ctx.restore();
    }

          ctx.lineTo(bx + 260, H);

          ctx.closePath();
          ctx.fill();

        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(0, 1250);
        ctx.quadraticCurveTo(540, 1180, W, 1270);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();

    // =========================================================================
    // MAIN RENDER LOOP
    // =========================================================================
    function renderFrame(t) {
      ctx.clearRect(0, 0, W, H);

      if (t < 5.0)       renderScene1(t);
      else if (t < 20.0) renderScene2(t);
      else if (t < 40.0) renderScene3(t);
      else if (t < 60.0) renderScene4(t);
      else               renderScene5(t);

      // Subtle corner watermark / timestamp bar
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      roundRect(38, 38, 220, 48, 12, 'rgba(0,0,0,0.45)', 'rgba(255,255,255,0.2)', 3);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = `800 24px ${FONT_BOLD}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SOSUS // 1991', 148, 63);
      ctx.restore();

      // Kinetic Subtitles always rendered cleanly on top
      drawSubtitles(t);

      // Sync UI
      updateUI(t);
    }

    function fmtTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function updateUI(t) {
      scrubber.value = t;
      scrubber.style.setProperty('--prog', `${(t / DURATION) * 100}%`);
      timeLabel.textContent = `${fmtTime(t)} / ${fmtTime(DURATION)}`;

      const activeSceneStart = t < 5 ? 0 : t < 20 ? 5 : t < 40 ? 20 : t < 60 ? 40 : 60;
      scenePills.forEach(p => {
        p.classList.toggle('active', Number(p.dataset.t) === activeSceneStart);
      });

      if (isRecording) {
        recText.textContent = `REC ${fmtTime(t)}`;
      }
    }

    function loop(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      if (isPlaying) {
        const prev = currentTime;
        currentTime += dt;

        if (currentTime >= DURATION) {
          currentTime = DURATION;
          isPlaying = false;
          playBtn.textContent = '▶ Play';
          sfx.updateAmbient(currentTime, false);
          renderFrame(currentTime);
          if (isRecording) stopRecording();
          return;
        }

        sfx.checkCues(prev, currentTime);
        sfx.updateAmbient(currentTime, true);
      }

      renderFrame(currentTime);
      requestAnimationFrame(loop);
    }

    // =========================================================================
    // PLAYBACK & RECORDING CONTROLS
    // =========================================================================
    function startPlayback() {
      sfx.init();
      if (currentTime >= DURATION - 0.05) {
        currentTime = 0;
        sfx.resetCues(0);
      }
      isPlaying = true;
      lastTimestamp = null;
      playBtn.textContent = '❚❚ Pause';
      sfx.updateAmbient(currentTime, true);
    }

    function pausePlayback() {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      sfx.updateAmbient(currentTime, false);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pausePlayback();
      else startPlayback();
    });

    canvas.addEventListener('click', () => {
      if (isPlaying) pausePlayback();
      else startPlayback();
    });

    restartBtn.addEventListener('click', () => {
      sfx.init();
      currentTime = 0;
      sfx.resetCues(0);
      startPlayback();
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      sfx.setMuted(isMuted);
      muteBtn.textContent = isMuted ? '🔇 Muted' : '🔊 SFX On';
    });

    scrubber.addEventListener('input', (e) => {
      sfx.init();
      currentTime = parseFloat(e.target.value);
      sfx.resetCues(currentTime);
      sfx.updateAmbient(currentTime, isPlaying);
      renderFrame(currentTime);
    });

    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        sfx.init();
        currentTime = Number(pill.dataset.t);
        sfx.resetCues(currentTime);
        startPlayback();
      });
    });

    // MediaRecorder Video Export (Canvas 30fps + Web Audio Stream)
    function startRecording() {
      sfx.init();
      recordedChunks = [];

      const videoStream = canvas.captureStream(30);
      const audioTracks = sfx.mediaDest ? sfx.mediaDest.stream.getAudioTracks() : [];
      const combinedStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...audioTracks
      ]);

      const mimeTypes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      const chosenMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';

      try {
        mediaRecorder = chosenMime
          ? new MediaRecorder(combinedStream, { mimeType: chosenMime, videoBitsPerSecond: 6000000 })
          : new MediaRecorder(combinedStream);
      } catch (err) {
        alert('MediaRecorder is not supported in this browser: ' + err.message);
        return;
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `1991-sosus-acoustic-void.${blob.type.includes('mp4') ? 'mp4' : 'webm'}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      };

      // Restart from 00:00 cleanly for full export
      currentTime = 0;
      sfx.resetCues(0);
      isRecording = true;
      recBadge.classList.add('active');
      recordBtn.classList.add('recording');
      recordBtn.textContent = '■ Stop & Save';

      mediaRecorder.start(200);
      startPlayback();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      recBadge.classList.remove('active');
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record Video';
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      pausePlayback();
    }

    recordBtn.addEventListener('click', () => {
      if (isRecording) stopRecording();
      else startRecording();
    });

    // Initial Frame & Animation Loop
    renderFrame(0);
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
